version: '3.8'
services:
  qdrant:
    image: qdrant/qdrant:v1.9.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  web-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8051:8051"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy

  sync-agent:
    build:
      context: ./sync
      dockerfile: Dockerfile
    volumes:
      - "./docs:/app/docs"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      api:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  qdrant_data:
