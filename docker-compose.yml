services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      # Переопределяем хосты для работы внутри docker network
      - DATABASE_URL=postgresql://rag_user:rag_password@db:5432/rag_db
      - QDRANT_HOST=qdrant
      - LM_STUDIO_URL=http://host.docker.internal:1234/v1
    volumes:
      - uploads_data:/app/data/uploads
      - fastembed_cache:/root/.cache/fastembed
    depends_on:
      - db
      - qdrant

volumes:
  qdrant_data:
  pgdata:
  uploads_data:
  fastembed_cache:
