version: '3.8'
services:
  qdrant:
    image: qdrant/qdrant:v1.9.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - qdrant

  web-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8051:8051"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api

  sync-agent:
    build:
      context: ./sync
      dockerfile: Dockerfile
    volumes:
      - "./docs:/app/docs"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - qdrant

volumes:
  qdrant_data:
